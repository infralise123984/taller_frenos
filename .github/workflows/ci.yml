name: CI

# Se ejecuta en cada push a main o desarrollo, y en cada pull request que
# apunte a cualquiera de las dos. Así el trabajo en curso se valida en la rama
# antes de integrarse, y no recién cuando ya llegó a main.
on:
  push:
    branches: [main, desarrollo]
  pull_request:
    branches: [main, desarrollo]

# Si llega un push nuevo mientras la ejecución anterior sigue en curso, la
# cancela: no tiene sentido validar una revisión ya obsoleta.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificaciones:
    name: Pruebas y estilo
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt

      - name: Instalar dependencias de Tailwind
        run: npm ci

      - name: Análisis estático
        run: ruff check .

      - name: Verificar formato
        run: ruff format --check .

      # El CSS compilado se versiona porque ni las pruebas ni el despliegue
      # ejecutan Node. Esta comprobación evita que quede desactualizado respecto
      # de las clases que usan las plantillas y los módulos de Python.
      - name: Verificar que el CSS de Tailwind esté al día
        run: |
          npm run build:css
          git diff --exit-code -- static/css/tailwind.css

      # No se necesita archivo .env: config/settings/dev.py trae valores por
      # defecto para desarrollo y las pruebas no tocan servicios externos.
      - name: Pruebas
        run: python manage.py test --verbosity 2
