{% load static %}
<header class="no-print border-b border-slate-200 bg-white">
  <div class="mx-auto flex w-full max-w-5xl flex-col gap-3 px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-6">

    <a href="{% url 'workshop:buscar' %}" class="flex items-center gap-2 text-lg font-bold text-slate-900">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-sky-700 text-sm font-black text-white">TF</span>
      Taller de Frenos
    </a>

    <nav class="flex flex-wrap items-center gap-2">
      <a href="{% url 'workshop:buscar' %}"
         class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">
        Buscar
      </a>
      <a href="{% url 'workshop:ingreso_create' %}"
         class="rounded-lg bg-sky-700 px-3 py-2 text-sm font-semibold text-white hover:bg-sky-800">
        + Nuevo ingreso
      </a>

      {% if user.is_staff %}
        <a href="{% url 'accounts:invitaciones' %}"
           class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">
          Cuentas
        </a>
      {% endif %}

      {% if user.is_authenticated %}
        <span class="hidden text-sm text-slate-500 sm:inline">{{ user.get_short_name }}</span>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button type="submit"
                  class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50">
            Salir
          </button>
        </form>
      {% endif %}
    </nav>

  </div>
</header>
